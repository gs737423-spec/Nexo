<style>
  body { margin:0; font-family:'Sora',system-ui,-apple-system,sans-serif; background:#F3F7FC; color:#09142F; -webkit-font-smoothing:antialiased; transition:background .35s ease,color .25s ease; position:relative; }
  body::before { content:""; position:fixed; inset:0; pointer-events:none; z-index:-1; opacity:.9; background:radial-gradient(760px 500px at 15% 4%,rgba(37,99,235,.22),transparent 68%),radial-gradient(680px 460px at 88% 72%,rgba(13,148,136,.18),transparent 68%),linear-gradient(118deg,transparent 0%,rgba(37,99,235,.055) 39%,rgba(13,148,136,.075) 50%,transparent 66%),linear-gradient(rgba(90,112,145,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(90,112,145,.09) 1px,transparent 1px); background-size:auto,auto,180% 180%,42px 42px,42px 42px; mask-image:linear-gradient(to bottom,black 0%,black 78%,transparent 100%); animation:ambientDrift 16s ease-in-out infinite alternate; }
  body::after { content:""; position:fixed; width:72vw; height:22vh; left:18vw; top:38%; pointer-events:none; z-index:-1; border-radius:50%; background:linear-gradient(90deg,transparent,rgba(37,99,235,.11),rgba(13,148,136,.10),transparent); filter:blur(24px); transform:rotate(-12deg); animation:ambientBeam 11s ease-in-out infinite alternate; }
  a { color:#2563EB; text-decoration:none; }
  a:hover { color:#1D4ED8; }
  * { box-sizing:border-box; }
  input,select,button,textarea { font-family:inherit; }
  button { cursor:pointer; transition:transform .16s cubic-bezier(.2,.8,.2,1),box-shadow .16s ease,background .2s ease,border-color .2s ease,filter .2s ease; }
  button:hover { transform:translateY(-2px); filter:brightness(1.015); }
  button:active { transform:translateY(0) scale(.98); }
  input,select { transition:border-color .16s ease,box-shadow .16s ease; }
  input:focus,select:focus { border-color:#8B00E6 !important; box-shadow:0 0 0 3px rgba(139,0,230,.14) !important; }
  @keyframes spin { to { transform:rotate(360deg); } }

<script>
"use strict";

var state = { loggedIn:false, screen:'dashboard', selectedId:null, clientKey:'', vendorKey:'', editingDetail:false, search:'', filter:'all', filterExpanded:false, carrierFilter:'all', deadlineFilter:'all', sortDirection:'asc', uploadStep:'idle', processingStep:0, uploadData:null, dragOver:false, session:null, apiError:'', accountMenu:false, loginLoading:false, showPassword:false, report:null, manualStatus:null, theme:'dark' };

  SAIU_PARA_ENTREGA:{label:'Saiu para entrega',color:'#D97706',bg:'#FEF3C7'},
  ENTREGUE:{label:'Entregue',color:'#16A34A',bg:'#DCFCE7'},
  ATRASADO:{label:'Atrasado',color:'#DC2626',bg:'#FEE2E2'},
  OCORRENCIA:{label:'Problema na entrega',color:'#DC2626',bg:'#FEE2E2'},

};
function themedStatus(status, fallback){
  if(state.theme!=='dark') return fallback;
  var dark={COLETADO:{bg:'#24112D',color:'#D490FF'},EM_TRANSITO:{bg:'#24112D',color:'#D490FF'},UNIDADE_DESTINO:{bg:'#24112D',color:'#D490FF'},SAIU_PARA_ENTREGA:{bg:'#302611',color:'#F3BF45'},ENTREGUE:{bg:'#10281E',color:'#66E6A9'},ATRASADO:{bg:'#301417',color:'#FF7C85'},OCORRENCIA:{bg:'#302611',color:'#F3BF45'},CANCELADO:{bg:'#301417',color:'#FF7C85'},AGUARDANDO_COLETA:{bg:'#242126',color:'#B7AFBC'},SEM_INFORMACAO:{bg:'#242126',color:'#B7AFBC'},NOTA_CADASTRADA:{bg:'#242126',color:'#B7AFBC'}};
  return dark[status]?{label:fallback.label,bg:dark[status].bg,color:dark[status].color}:fallback;
}
var NOW = new Date();

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function parseD(iso){ if(!iso) return null; return iso.indexOf('T')>=0 ? new Date(iso) : new Date(iso+'T12:00:00'); }
function fmtDate(iso){ var d=parseD(iso); if(!d) return '—'; return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear(); }
function fmtShort(iso){ var d=parseD(iso); if(!d) return '—'; return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'); }
function fmtTime(iso){ var d=parseD(iso); if(!d) return ''; return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function fmtDateTime(iso){ return fmtDate(iso)+' — '+fmtTime(iso); }
function timeAgo(iso){ if(!iso) return '—'; var mins=Math.round((NOW-new Date(iso))/60000); if(mins<1) return 'agora'; if(mins<60) return 'há '+mins+' min'; var hrs=Math.round(mins/60); if(hrs<24) return 'há '+hrs+'h'; return 'há '+Math.round(hrs/24)+'d'; }
function deadlineInfo(iso){
  if(!iso) return {key:'none',label:'Sem data',color:'#7F8DA1',bg:'#273142'};
  var today=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate());
  var due=parseD(iso); var date=new Date(due.getFullYear(),due.getMonth(),due.getDate());
  var days=Math.round((date-today)/86400000);
  if(days<0) return {key:'late',label:'Atrasada',color:'#FF7078',bg:'#39161B'};
  if(days===0) return {key:'today',label:'Hoje',color:'#FFC45C',bg:'#38290F'};
  if(days<=3) return {key:'soon',label:'Próxima',color:'#D490FF',bg:'#24112D'};
  return {key:'later',label:'No prazo',color:'#5EE39A',bg:'#0F3025'};
}
function fmtCurrency(v){ return v!=null ? 'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2}) : '—'; }

async function api(path, options){
  options=options||{};
  var headers=options.headers||{};
  if(state.session&&state.session.token) headers.Authorization='Bearer '+state.session.token;
  var response = await fetch('/api'+path,{method:options.method,headers:headers,body:options.body});
  var payload;
  if(typeof response.text === 'function'){
    var raw = await response.text();
    try { payload = raw ? JSON.parse(raw) : {}; }
    catch(ignore) { throw new Error('A API retornou uma resposta inválida. Tente novamente em instantes.'); }
  } else {
    payload = await response.json();
  }
  if(response.status===401 && state.loggedIn){ state.loggedIn=false; state.session=null; state.apiError='Sua sessão expirou. Entre novamente.'; render(); }
  if(!response.ok) throw new Error(payload.error || 'Não foi possível concluir a solicitação.');
  return payload;
}
function jsonOptions(body){ return {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}; }
window.openInvoiceDocument=async function(id,event){ if(event){event.preventDefault();event.stopPropagation();} var tab=window.open('about:blank','_blank'); try { var headers={}; if(state.session&&state.session.token) headers.Authorization='Bearer '+state.session.token; var response=await fetch('/api/invoices/'+id+'/document',{headers:headers}); if(!response.ok){ var detail='Não foi possível abrir o documento.'; try { var payload=await response.json(); if(payload&&payload.error) detail=payload.error; } catch(ignore) {} throw new Error(detail); } var blob=await response.blob(); var url=URL.createObjectURL(blob); if(tab){tab.location.href=url;} else {window.location.href=url;} setTimeout(function(){URL.revokeObjectURL(url);},60000); } catch(error){ if(tab) tab.close(); state.apiError=error.message.indexOf('não possui')>=0?error.message:'Não foi possível abrir o documento original. Verifique se o PDF/XML foi anexado novamente.'; render(); } };
function fieldValue(id, fallback){ var field=document.getElementById(id); return field ? field.value : fallback; }
function readFileAsBase64(file){
  return new Promise(function(resolve,reject){
    var reader=new FileReader();
    reader.onerror=function(){ reject(new Error('Não foi possível ler o arquivo selecionado.')); };
    reader.onload=function(){ resolve(String(reader.result).split(',')[1] || ''); };
    reader.readAsDataURL(file);
  });
}
async function loadData(){
  var data = await api('/bootstrap');
  carriers = data.carriers;
  invoices = data.invoices;
  if(state.session) state.session.user=data.user;
}
async function startProcessing(file){
  if(!file) return;
  if(file.size>10*1024*1024){ state.apiError='O arquivo ultrapassa o limite de 10 MB.'; render(); return; }
  state.apiError=''; state.uploadStep='processing'; state.processingStep=1; state.dragOver=false; render();
  try {
    state.processingStep=2; render();
    var fileContent=await readFileAsBase64(file);
    var result = await api('/uploads/parse', jsonOptions({fileName:file.name,fileContent:fileContent}));
    state.processingStep=3; state.uploadStep='confirming'; state.uploadData=Object.assign({},result.draft,{documentName:file.name,documentContent:fileContent}); render();
  } catch(error) {
    state.uploadStep='idle'; state.apiError=error.message; render();
  }
}
async function confirmUpload(){
  var d=state.uploadData;
  if(!d) return;
  var destination=fieldValue('f_dest',(d.city||'')+' / '+(d.state||'')).split('/');
  try {
    state.apiError='';

      nf:fieldValue('f_nf',d.nf),carrier:fieldValue('f_carrier',d.carrier),recipient:fieldValue('f_recipient',d.recipient),recipientDoc:fieldValue('f_doc',d.doc),date:fieldValue('f_date',d.date),order:fieldValue('f_order',d.order),rca:fieldValue('f_rca',''),eta:fieldValue('f_eta',''),tracking:fieldValue('f_tracking',''),cte:fieldValue('f_cte',''),city:(destination[0]||'').trim(),state:(destination[1]||'').trim(),issuer:d.issuer||'',value:d.value,items:d.items||[],documentName:d.documentName,documentContent:d.documentContent
    }));
    await loadData();
    state.screen='detail'; state.selectedId=inv.id; state.uploadStep='idle'; state.uploadData=null;
    render();
  } catch(error) {
    state.apiError=error.message; render();
  }
}

function captureAppFrame(){
  return new Promise(function(resolve){
    var root=document.getElementById('root');
    var width=Math.max(document.documentElement.clientWidth,900), height=Math.max(document.documentElement.clientHeight,600);
    var canvas=document.createElement('canvas'); canvas.width=width; canvas.height=height;
    var fallback=function(){
      var context=canvas.getContext('2d'); context.fillStyle='#F7F9FC'; context.fillRect(0,0,width,height);
      context.fillStyle='#101828'; context.font='700 28px Arial'; context.fillText('NEXO — Report de tela',48,72);
      context.fillStyle='#667085'; context.font='16px Arial'; context.fillText('A marcação abaixo foi feita na tela '+state.screen+'.',48,108);
      resolve(canvas.toDataURL('image/png'));
    };
    if(!root){ fallback(); return; }
    try {
      var clone=root.cloneNode(true);
      clone.style.width=width+'px'; clone.style.minHeight=height+'px';
      var serialized=new XMLSerializer().serializeToString(clone);
      var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+width+'" height="'+height+'"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml" style="width:'+width+'px;height:'+height+'px;overflow:hidden;background:#F7F9FC">'+serialized+'</div></foreignObject></svg>';
      var image=new Image();
      image.onload=function(){ try { canvas.getContext('2d').drawImage(image,0,0); resolve(canvas.toDataURL('image/png')); } catch(error) { fallback(); } };
      image.onerror=fallback;
      image.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
    } catch(error) { fallback(); }
  });
}

-top:5px"></div></div><div style="margin-top:16px;padding:12px;background:#F8FAFC;border:1px solid #E7EDF5;border-radius:10px"><div style="font-size:13px;font-weight:700">Marcações</div><div style="font-size:12px;color:#667085;margin-top:3px">Cada área precisa de uma legenda antes do envio.</div>'+((report.selections||[]).length?legends:'<div style="font-size:13px;color:#667085;margin-top:10px">Nenhuma área marcada ainda.</div>')+'</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px"><span style="font-size:12px;color:#667085">'+(report.selections||[]).length+' área(s) marcada(s)</span><button onclick="window.submitReport()" style="background:#1769E0;color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:700">Enviar relatório</button></div></div></div>';

function computeRows(){
  var active=['COLETADO','EM_TRANSITO','UNIDADE_DESTINO','SAIU_PARA_ENTREGA'];
  var filtered=invoices.slice();
  if(state.search){ var q=state.search.toLowerCase(); filtered=filtered.filter(function(i){ var carrier=getCarrier(i.carrierId); return i.nf.indexOf(q)>=0 || i.recipient.toLowerCase().indexOf(q)>=0 || (i.order||'').toLowerCase().indexOf(q)>=0 || (carrier.name||'').toLowerCase().indexOf(q)>=0; }); }
  var fm={all:null,transito:active,saiu:['SAIU_PARA_ENTREGA'],entregues:['ENTREGUE'],atrasadas:['ATRASADO'],ocorrencias:['OCORRENCIA']};
  if(state.filter!=='all' && fm[state.filter]) filtered=filtered.filter(function(i){ return fm[state.filter].indexOf(i.status)>=0; });
  if(state.deadlineFilter!=='all') filtered=filtered.filter(function(i){ return deadlineInfo(i.eta).key===state.deadlineFilter; });
  if(state.carrierFilter!=='all') filtered=filtered.filter(function(i){ return getCarrier(i.carrierId).name===state.carrierFilter; });
  var unique={}; filtered=filtered.filter(function(i){ var key=(i.nf||'')+'|'+(i.recipientDoc||'')+'|'+(i.recipient||'').trim().toLowerCase(); if(unique[key]) return false; unique[key]=true; return true; });
  filtered.sort(function(a,b){
    var ad=a.eta?new Date(a.eta+'T00:00:00').getTime():null;
    var bd=b.eta?new Date(b.eta+'T00:00:00').getTime():null;
    if(ad===null && bd!==null) return 1;
    if(ad!==null && bd===null) return -1;
    if(ad===null && bd===null) return String(a.nf||'').localeCompare(String(b.nf||''));
    if(ad===bd) return String(a.nf||'').localeCompare(String(b.nf||''));
    return state.sortDirection==='desc' ? bd-ad : ad-bd;
  });
  return filtered;
}

  var months=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  var etaD=parseD(inv.eta);

  var isAlert=inv.status==='ATRASADO'||inv.status==='OCORRENCIA';

  var steps=['NOTA_CADASTRADA','COLETADO','EM_TRANSITO','UNIDADE_DESTINO','SAIU_PARA_ENTREGA','ENTREGUE'];
  var evts=inv.events||[];
  var lastIdx = evts.reduce(function(highest,event){ return Math.max(highest, steps.indexOf(event.s)); }, -1);
  var timelineHtml='';
  evts.forEach(function(e,idx){
    var completed = idx<evts.length-1, current = idx===evts.length-1;
    timelineHtml+=timelineItem(e.l, fmtDateTime(e.d), e.loc, completed?'#16A34A':'#2563EB', 'none', '#111827', current?'600':'400', true);
  });
  var pending=steps.filter(function(st,idx){ return idx>lastIdx && !evts.some(function(e){return e.s===steps[idx];}); });
  pending.forEach(function(step,idx){

  var selectedManualStatus=state.manualStatus||inv.status;

    '<div style="margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button onclick="window.refreshTracking()" style="display:flex;align-items:center;gap:6px;padding:9px 13px;border:1px solid #DDE5F0;border-radius:12px;background:#fff;font-size:12px;color:#344054;font-weight:800">'+ICON_REFRESH+'Consultar</button><button onclick="window.toggleDetailEdit()" style="padding:9px 12px;border:1px solid #DDE5F0;border-radius:12px;background:#fff;color:#344054;font-size:12px;font-weight:800">'+(state.editingDetail?'Cancelar edição':'Editar dados')+'</button>'+((state.session||{}).user&&['admin','manager'].indexOf((state.session||{}).user.role)>=0?'<button onclick="window.deleteInvoice()" style="padding:9px 12px;border:1px solid #FCA5A5;border-radius:12px;background:#FFF1F2;color:#B42318;font-size:12px;font-weight:800">Excluir nota</button>':'')+'</div>'+
  '</div>';

  html+='<div style="display:flex;gap:14px;margin-bottom:20px;flex-wrap:wrap">'+
    statCard('Status','<span style="display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:500;background:'+s.bg+';color:'+s.color+'">'+s.label+'</span>')+
    statCard('Previsão de entrega','<div style="font-size:15px;font-weight:600">'+etaShort+'</div>')+
    statCard('Última atualização','<div style="font-size:15px;font-weight:600">'+(inv.lastCheck?fmtShort(inv.lastCheck)+' às '+fmtTime(inv.lastCheck):'—')+'</div>')+
  '</div>';

  html+='<section class="stage-update" aria-label="Atualizar etapa da entrega">'+
    '<div class="stage-copy"><strong>Atualizar entrega</strong><span>Escolha a etapa atual</span></div>'+
    '<input id="manualStatus" type="hidden" value="'+esc(selectedManualStatus)+'">'+
    '<div class="stage-options">'+stageOptions+'</div>'+
    '<input id="manualNote" class="stage-note" maxlength="300" aria-label="Observação da atualização" placeholder="Adicionar observação">'+
    '<button class="stage-save" onclick="window.updateManualStatus()">Salvar atualização</button>'+
  '</section>';

  if(isAlert){
    html+='<div style="background:#FEF2F2;border:1px solid #FECACA;border-radius:10px;padding:12px 16px;margin-bottom:20px;display:flex;align-items:center;gap:10px">'+ICON_ALERT+'<span style="font-size:13px;color:#991B1B;font-weight:500">'+esc(alertMsg)+'</span></div>';
  }

  html+='<div class="detail-grid">'+
    '<div>'+
      section('Entrega','<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">'+
        kv('Transportadora',c.name)+kv('Código de rastreio',inv.tracking||'Não informado')+
        kv('CT-e',inv.cte||'Não informado')+
        kv('Destino',inv.city+'/'+inv.state)+kv('Previsão',inv.eta?fmtDate(inv.eta):'Não informada')+
      '</div>')+
      section('Timeline','<div>'+timelineHtml+'</div>')+
      section('Itens da nota fiscal', (inv.items&&inv.items.length ? '<div style="display:flex;flex-direction:column;gap:8px">'+inv.items.map(function(item,index){ return '<div style="padding:11px 12px;border:1px solid rgba(148,163,184,.18);border-radius:10px;background:rgba(148,163,184,.045)"><div style="font-size:13px;font-weight:600">'+(index+1)+'. '+esc(item.description)+'</div><div style="font-size:12px;color:#667085;margin-top:4px">Qtd.: '+esc(item.quantity)+' '+esc(item.unit||'')+' · Valor unit.: '+fmtCurrency(item.unitValue)+' · Total: '+fmtCurrency(item.total)+'</div></div>'; }).join('')+'</div>' : '<div style="font-size:13px;color:#667085">Itens não identificados no arquivo enviado.</div>'))+
    '</div>'+
    '<div>'+
      section('Nota fiscal','<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'+
        kv2('Número',inv.nf)+kv2('Série',inv.series)+kv2('Pedido',inv.order||'Não informado')+
        (state.editingDetail?'<div><div style="font-size:11px;color:#667085">RCA do vendedor</div><input id="editRca" value="'+esc(inv.rca||'')+'" placeholder="Ex.: 105604" style="width:100%;padding:7px 9px;border:1px solid #DDE5F0;border-radius:8px;font-size:13px"></div>':(inv.rca?kvLink('RCA do vendedor',inv.rca,"window.goToVendor('"+esc(inv.rca).replace(/'/g,"\\'")+"')"):kv2('RCA do vendedor','Não informado')))+
        (state.editingDetail?'<div><div style="font-size:11px;color:#667085">Data prevista</div><input id="editEta" type="date" value="'+esc(inv.eta||'')+'" style="width:100%;padding:7px 9px;border:1px solid #DDE5F0;border-radius:8px;font-size:13px"></div>':kv2('Data prevista',inv.eta?fmtDate(inv.eta):'Não informada'))+
        kv2('Emissão',fmtDate(inv.issued))+kv2('Emissor',inv.issuer||'Não identificado')+kv2('Valor',fmtCurrency(inv.value),true)+kv2('Enviada por',inv.uploadedBy||inv.by||'Não identificado')+kv2('Enviada em',inv.uploadedAt?fmtDateTime(inv.uploadedAt):'Data anterior não registrada')+
        (state.editingDetail?'<div style="grid-column:1/-1"><button onclick="window.saveDetailEdit()" style="padding:8px 12px;border:0;border-radius:8px;background:#1769E0;color:#fff;font-size:12px;font-weight:700">Salvar dados</button></div>':'')+
        '<div style="grid-column:1/-1;margin-top:4px"><a href="/api/invoices/'+inv.id+'/document" onclick="window.openInvoiceDocument('+inv.id+',event)" style="display:inline-flex;align-items:center;gap:7px;padding:9px 12px;border:1px solid #DDE5F0;border-radius:9px;color:#1769E0;font-size:12px;font-weight:700">Abrir PDF/XML original</a></div>'+ 
      '</div>')+
      section('Destinatário','<div style="display:flex;flex-direction:column;gap:10px">'+
        kvLink('Nome',inv.recipient,"window.goToClient('"+esc(inv.recipient).replace(/'/g,"\\'")+"')")+kv2('CNPJ/CPF',inv.recipientDoc)+kv2('Cidade/UF',inv.city+'/'+inv.state)+
      '</div>')+
      section('Transportadora e rastreio','<div style="display:flex;flex-direction:column;gap:10px">'+
        '<div style="font-size:14px;font-weight:600">'+esc(c.name)+'</div>'+
        '<div style="display:flex;align-items:center;gap:8px">'+ICON_PHONE+'<span style="font-size:13px">'+esc(c.phone||'Não cadastrado')+'</span></div>'+
        '<div style="display:flex;align-items:center;gap:8px">'+ICON_MAIL+'<span style="font-size:13px">'+esc(c.email||'Não cadastrado')+'</span></div>'+
        (c.contactSource ? '<div style="font-size:11px;color:#667085">Fonte do contato: '+esc(c.contactSource)+'</div>' : '')+
        (c.trackingUrl ? '<a href="'+esc(c.trackingUrl)+'" target="_blank" rel="noopener noreferrer" style="display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:8px;background:#EAF2FF;color:#1769E0;font-size:13px;font-weight:700">'+ICON_LINK+esc(c.trackingLabel||'Rastrear no portal recomendado')+'</a>' : '')+
        '<div style="display:flex;gap:8px;flex-wrap:wrap"><a href="https://ssw.inf.br/2/rastreamento" target="_blank" rel="noopener noreferrer" style="font-size:12px;color:#526078">Portal SSW</a><span style="color:#CBD5E1">•</span><a href="https://www.track3r.com.br/rastreamento/" target="_blank" rel="noopener noreferrer" style="font-size:12px;color:#526078">Track3r</a></div>'+
        '<div style="font-size:11px;color:#667085">Use os portais alternativos somente se a transportadora operar neles.</div>'+
      '</div>')+
    '</div>'+
  '</div>';

  return html;
}

function renderDirectory(kind,key){

function timelineItem(label,date,loc,dotBg,dotBorder,labelColor,labelWeight,showLine){
  var pending=dotBg==='transparent'; var current=!pending && labelWeight==='600';
  return '<div class="timeline-step '+(pending?'pending':current?'current':'complete')+'">'+
    (showLine?'<div class="timeline-rail"></div>':'')+
    '<div class="timeline-node" style="background:'+(pending?'transparent':dotBg)+';border:'+(pending?'2px solid #CBD5E1':dotBorder==='none'?'0':dotBorder)+';color:'+(pending?'#94A3B8':'#fff')+'">'+(pending?'':current?'●':'✓')+'</div>'+
    '<div class="timeline-content"><div style="font-size:13px;font-weight:'+(current?'800':pending?'600':'700')+';color:'+(pending?'#94A3B8':labelColor)+'">'+esc(label)+'</div>'+

      (loc ? '<div style="font-size:11px;color:#9CA3AF;margin-top:2px">'+esc(loc)+'</div>' : '')+'</div></div>';
}

function render(){
  var root=document.getElementById('root');
  if(!state.loggedIn){ root.innerHTML=renderLogin(); return; }
  var body = state.screen==='dashboard' ? renderDashboard() : state.screen==='upload' ? renderUpload() : state.screen==='reports' ? renderReports() : state.screen==='client' ? renderDirectory('client',state.clientKey) : state.screen==='vendor' ? renderDirectory('vendor',state.vendorKey) : renderDetail();
  var error = state.apiError ? '<div style="margin-bottom:16px;padding:11px 14px;background:#FEF2F2;border:1px solid #FECACA;border-radius:8px;color:#991B1B;font-size:13px">'+esc(state.apiError)+'</div>' : '';
  root.innerHTML = renderNav() + '<main class="page-enter" style="max-width:1200px;margin:0 auto;padding:28px 24px 40px;min-height:calc(100vh - 70px)">'+error+body+'</main>'+renderReportOverlay();
}

  } catch(error) { state.apiError=error.message; state.loginLoading=false; render(); }
};

window.deleteInvoice=async function(){

  try {
    state.apiError='';
    await api('/invoices/'+inv.id,{method:'DELETE'});
    invoices=invoices.filter(function(item){ return item.id!==inv.id; });
    state.screen='dashboard'; state.selectedId=null; render();
  } catch(error) { state.apiError=error.message; render(); }
};
var reportPickHandler=null;
window.startReport=function(){
  state.report={status:'picking',screenshot:'',selections:[],title:'',description:''};
  reportPickHandler=function(event){
    if(!state.report||state.report.status!=='picking'||event.target.closest('#reportPicker')) return;
    event.preventDefault(); event.stopImmediatePropagation();
    var target=event.target.closest('button,a,input,select,[data-reportable],div');
    if(!target||target.id==='root'||target.tagName==='MAIN'||target.closest('nav')) return;
    if(target.dataset.reportSelected){ target.style.outline=''; target.style.outlineOffset=''; delete target.dataset.reportSelected; state.report.selections=state.report.selections.filter(function(s){return s.element!==target;}); }
    else { target.dataset.reportSelected='true'; target.style.outline='3px solid #1769E0'; target.style.outlineOffset='3px'; state.report.selections.push({element:target,x:0,y:0,width:.01,height:.01,kind:'ERRO',legend:(target.getAttribute('aria-label')||target.textContent||'Elemento da tela').trim().slice(0,300)}); }
    var picker=document.getElementById('reportPicker'); if(picker) picker.querySelector('div div').textContent='Clique nos elementos com problema. '+state.report.selections.length+' selecionado(s).';
  };
  document.addEventListener('click',reportPickHandler,true); render();
};
window.cancelReport=function(){ if(reportPickHandler) document.removeEventListener('click',reportPickHandler,true); reportPickHandler=null; state.report=null; render(); };
window.finishReportPicking=async function(){ if(!state.report.selections.length){ state.apiError='Selecione pelo menos um elemento antes de continuar.'; return; } state.report.selections.forEach(function(s){s.element.style.outline='';s.element.style.outlineOffset='';delete s.element.dataset.reportSelected;delete s.element;}); if(reportPickHandler) document.removeEventListener('click',reportPickHandler,true); reportPickHandler=null; state.report.status='editing'; state.report.screenshot=await captureAppFrame(); render(); };
window.reportPointerDown=function(event){
  var area=document.getElementById('reportCanvas'); if(!area||!state.report) return;
  event.preventDefault();
  var rect=area.getBoundingClientRect(); state.report.start={x:Math.max(0,Math.min(1,(event.clientX-rect.left)/rect.width)),y:Math.max(0,Math.min(1,(event.clientY-rect.top)/rect.height))}; state.report.draft={x:state.report.start.x,y:state.report.start.y,width:0,height:0};
  var draft=document.getElementById('reportDraft'); if(draft){ draft.style.display='block'; draft.style.left=(state.report.start.x*100)+'%'; draft.style.top=(state.report.start.y*100)+'%'; draft.style.width='0'; draft.style.height='0'; }
  area.setPointerCapture&&area.setPointerCapture(event.pointerId);
};
window.reportPointerMove=function(event){
  var area=document.getElementById('reportCanvas'), start=(state.report||{}).start; if(!area||!start) return;
  var rect=area.getBoundingClientRect(), endX=Math.max(0,Math.min(1,(event.clientX-rect.left)/rect.width)), endY=Math.max(0,Math.min(1,(event.clientY-rect.top)/rect.height));
  state.report.draft={x:Math.min(start.x,endX),y:Math.min(start.y,endY),width:Math.abs(endX-start.x),height:Math.abs(endY-start.y)};
  var draft=document.getElementById('reportDraft'); if(draft){ draft.style.left=(state.report.draft.x*100)+'%'; draft.style.top=(state.report.draft.y*100)+'%'; draft.style.width=(state.report.draft.width*100)+'%'; draft.style.height=(state.report.draft.height*100)+'%'; }
};
window.reportPointerUp=function(event){
  var area=document.getElementById('reportCanvas'), start=(state.report||{}).start; if(!area||!start) return;
  var rect=area.getBoundingClientRect(), endX=Math.max(0,Math.min(1,(event.clientX-rect.left)/rect.width)), endY=Math.max(0,Math.min(1,(event.clientY-rect.top)/rect.height));
  var x=Math.min(start.x,endX), y=Math.min(start.y,endY), width=Math.abs(endX-start.x), height=Math.abs(endY-start.y);
  delete state.report.start; delete state.report.draft;
  if(width>.01&&height>.01){
    state.report.selections.push({x:x,y:y,width:width,height:height,kind:'ERRO',legend:''});
  }
  render();
};
window.reportPointerCancel=function(){ if(state.report){ delete state.report.start; delete state.report.draft; render(); } };
window.submitReport=async function(){
  var report=state.report; if(!report) return;
  if(!(report.selections||[]).length){ state.apiError='Marque ao menos uma área e informe sua legenda antes de enviar.'; render(); return; }
  if(report.selections.some(function(selection){ return !String(selection.legend||'').trim(); })){ state.apiError='Informe uma legenda para cada área marcada antes de enviar.'; render(); return; }
  try {
    var result=await api('/reports',jsonOptions({screenshot:report.screenshot,selections:report.selections,title:fieldValue('reportTitle',''),description:fieldValue('reportDescription',''),screen:state.screen}));
    state.report=null; state.apiError=''; render(); alert('Relatório #'+result.id+' enviado com sucesso.');
  } catch(error) { state.apiError=error.message; render(); }
};

render();
</script>
